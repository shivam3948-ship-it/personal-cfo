name: eval-voice-model
on:
  push:
    branches: [chore/eval-voice-model]
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        model: [claude-sonnet-5-5, claude-haiku-4-5-20251001]
        set: ['', redteam]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: packages/core
      - run: npm ci
        working-directory: apps/munim
      - name: Live eval, as voice runs in production (prefetch + AI check on)
        working-directory: apps/munim
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MUNIM_CHAT_MODEL: ${{ matrix.model }}
          MUNIM_JUDGE: 'on'
          EVAL_PREFETCH: '1'
          EVAL_SET: ${{ matrix.set }}
          RUN_LIVE: '1'
          EVAL_WRITE: '1'
        run: npx vitest run tests/evals.live.test.ts 2>&1 | tee eval.log; exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.model }}-${{ matrix.set || 'cases' }}
          path: |
            apps/munim/eval.log
            apps/munim/evals/results/*claude*
