name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo hygiene (no statements, PII, secrets; docs links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_repo.py
      - name: Validate Claude Code settings JSON
        run: python -m json.tool .claude/settings.json > /dev/null

  # The jobs below skip their steps until the code they test exists (Phase 0 = docs only).
  api:
    name: API lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f services/api/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.yes == 'true'
        working-directory: services/api
        run: |
          pip install -e ".[dev]"
          ruff check . && ruff format --check .
          pytest -q

  evals:
    name: AI eval gates
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f evals/run.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.yes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -e "services/api[dev]"
          python evals/run.py --gates

  voice-cfo:
    name: Munim (voice CFO) typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice-cfo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/voice-cfo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.present.outputs.yes == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck && npm run build

  web:
    name: Munim app (apps/web) typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
