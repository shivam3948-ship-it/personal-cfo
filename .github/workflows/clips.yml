name: teardown-clips
on:
  push:
    branches: [chore/teardown-clips]
    paths: [clips/make.mjs]
permissions: { contents: write }
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env: { SARVAM_API_KEY: "${{ secrets.SARVAM_API_KEY }}" }
        run: cd clips && node make.mjs
      - run: |
          git config user.name "Shivam Singh"; git config user.email "shivam.3948@gmail.com"
          git add clips/*.wav && git commit -m "chore: teardown clips (synthetic)" && git push
