# Munim's voice relay (D-100). Singapore, one small machine kept running so the first turn never waits for a cold start.
app = "munim-voice"
primary_region = "sin"  # Fly no longer provisions in Mumbai (bom); Singapore is the nearest

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1  # always warm: a cold start would cost the first turn 2–5 s
  [http_service.concurrency]
    type = "connections"
    soft_limit = 30
    hard_limit = 40
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
