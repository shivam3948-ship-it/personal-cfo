<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your rules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;700&amp;family=Noto+Serif+Devanagari:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Devanagari:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.serif{font-family:'Noto Serif','Noto Serif Devanagari',serif;font-weight:700;letter-spacing:-0.01em}
.t-light{--bg:#F2F7F6;--band:#DDEEEA;--band2:#CBE5E0;--band3:#BFDFD9;--card:#FFFFFF;--ink:#10201E;--ink2:#34514D;--muted:#4E6863;--hair:#D6E6E2;--hair2:#C7DBD7;--tint:#E8F2F0;--tint2:#E1F0ED;--btn:#0F5E58;--on-btn:#FFFFFF;--link:#0F5E58;--warn:#9A5B00;--mari:#F2A93B;--on-mari:#2B1D00;--mari-tint:#FBF1DD;--mari-ink:#6E4600;--err-tint:#FCEBE8;--err-ink:#A3271C;--scrim:rgba(0,0,0,.45);--skel:#D3E3DF;--ai1:#8E7CF0;--ai2:#5B47D6;--ai3:#2E2A7A;--ai-ink:#4B3BC4;--ai-glow:rgba(91,71,214,.42);--orb1:#86E6D9;--orb2:#14897F;--orb3:#063D39;--orb-glow:rgba(15,94,88,.45);color-scheme:light}
.t-dark{--bg:#0B1413;--band:#10211E;--band2:#163029;--band3:#1B3A34;--card:#14201E;--ink:#E6F0EE;--ink2:#C2D4D0;--muted:#93ABA6;--hair:#263835;--hair2:#334844;--tint:#1C2D2A;--tint2:#1E3330;--btn:#5CC2B4;--on-btn:#06201C;--link:#7ED3C7;--warn:#F2B860;--mari:#F2A93B;--on-mari:#2B1D00;--mari-tint:#33270F;--mari-ink:#F6C978;--err-tint:#3A1A17;--err-ink:#FF9E92;--scrim:rgba(0,0,0,.62);--skel:#1D2E2B;--ai1:#9C8CFF;--ai2:#6A55E6;--ai3:#352F8C;--ai-ink:#B9AEFF;--ai-glow:rgba(142,124,240,.38);--orb1:#A6F2E7;--orb2:#2BA295;--orb3:#0A4C46;--orb-glow:rgba(92,194,180,.40);color-scheme:dark}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.skel{background:var(--skel);border-radius:8px;animation:shimmer 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
@keyframes breathe{0%,100%{box-shadow:0 8px 22px var(--ai-glow),0 0 0 0 var(--ai-glow)}50%{box-shadow:0 8px 22px var(--ai-glow),0 0 0 7px rgba(0,0,0,0)}}
.ai-orb{background:radial-gradient(circle at 30% 25%,var(--ai1) 0%,var(--ai2) 52%,var(--ai3) 100%);animation:breathe 3.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.ai-orb{animation:none;box-shadow:0 8px 22px var(--ai-glow)}}
@keyframes orbspin{to{transform:rotate(360deg)}}
.orb-teal{background:radial-gradient(circle at 30% 25%,var(--orb1) 0%,var(--orb2) 48%,var(--orb3) 100%);box-shadow:0 10px 24px var(--orb-glow)}
.orb-teal::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,0,0,0) 0deg,var(--orb1) 80deg,var(--orb2) 120deg,rgba(0,0,0,0) 170deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));animation:orbspin 3.6s linear infinite;pointer-events:none}
@media (prefers-reduced-motion: reduce){.orb-teal::before{animation:none}}
</style>
</helmet>
<div class="t-{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', 'IBM Plex Sans Devanagari', system-ui, sans-serif; font-size: 16px; line-height: 1.4">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 170px; background: var(--band); overflow: hidden">
    <span style="position: absolute; right: -60px; top: -100px; width: 220px; height: 220px; border-radius: 50%; background: var(--band2)"></span>
  </div>
  <div style="position: absolute; inset: 0; overflow-y: auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
    <header style="flex: none; display: flex; align-items: center; gap: 4px; position: relative">
      <a href="Spends.dc.html" aria-label="{{c.back}}" style="width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; border-radius: 50%; text-decoration: none; color: var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <h1 class="serif" style="margin: 0; font-size: 28px">{{c.title}}</h1>
    </header>
    <span style="flex: none; position: relative; font-size: 14.5px; color: var(--ink2); margin-top: -4px">{{c.intro}}</span>

    <sc-if value="{{showSuggest}}" hint-placeholder-val="{{ true }}">
      <section aria-live="polite" style="flex: none; position: relative; background: var(--card); border-radius: 22px; padding: 16px; display: grid; gap: 8px; box-shadow: 0 0 0 1px var(--hair)">
        <span style="font-size: 12.5px; font-weight: 600; color: var(--link)">{{c.learnKicker}}</span>
        <b style="font-size: 16px; font-weight: 600; line-height: 1.35">{{c.learnTitle}}</b>
        <span style="font-size: 14px; color: var(--ink2)">{{c.learnSub}}</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
          <button type="button" onClick="{{accept}}" style="min-height: 48px; border-radius: 999px; border: 0; background: var(--btn); color: var(--on-btn); font-size: 15px; font-weight: 600; cursor: pointer">{{c.yes}}</button>
          <button type="button" onClick="{{dismiss}}" style="min-height: 48px; border-radius: 999px; border: 0; background: var(--tint); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer">{{c.no}}</button>
        </div>
      </section>
    </sc-if>

    <section style="flex: none; position: relative; background: var(--card); border-radius: 22px; padding: 4px 16px; box-shadow: 0 0 0 1px var(--hair)">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: {{r.rule}}">
          <span style="flex: 1; min-width: 0; display: grid; gap: 2px"><b style="font-size: 15px; font-weight: 600">{{r.what}}</b><span style="font-size: 13px; color: var(--muted)">{{r.scope}}</span></span>
          <button type="button" style="flex: none; min-height: 40px; padding: 0 12px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: var(--link); cursor: pointer">{{c.edit}}</button>
          <button type="button" onClick="{{r.del}}" aria-label="{{r.delLabel}}" style="flex: none; width: 40px; height: 40px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: var(--muted); cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
        </div>
      </sc-for>
      <sc-if value="{{noRules}}" hint-placeholder-val="{{ false }}"><span style="display: block; padding: 14px 0; font-size: 14.5px; color: var(--muted)">{{c.none}}</span></sc-if>
    </section>
    <span style="flex: none; position: relative; font-size: 12.5px; color: var(--muted); padding: 0 2px">{{c.foot}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"variant":{"editor":"enum","options":["standard","bharat"],"default":"standard"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { accepted: false, dismissed: false, deleted: {} }; }
  renderVals() {
    var s = this.state, self = this;
    var hi = (this.props.variant ?? 'standard') === 'bharat';
    var C = hi ? {
      title: 'आपके नियम', back: 'खर्च पर वापस', intro: 'जब आप कोई लेन-देन ठीक करते हैं, Munim पूछता है कि क्या आगे भी ऐसा ही करे। आपके नियम यहाँ हैं।',
      learnKicker: 'Munim ने ध्यान दिया', learnTitle: 'आपने Swiggy के 3 ऑर्डर "शेयर किया" मार्क किए', learnSub: 'क्या आगे के Swiggy ऑर्डर भी शेयर माने जाएँ? आप कभी भी बदल सकते हैं।', yes: 'हाँ, नियम बनाएँ', no: 'नहीं',
      edit: 'बदलें', none: 'अभी कोई नियम नहीं।', foot: 'नियम सिर्फ़ आपके अपने डेटा पर लागू होते हैं और आपके फ़ोन पर रहते हैं।'
    } : {
      title: 'Your rules', back: 'Back to Spends', intro: 'When you fix a transaction, Munim asks whether to do the same next time. These are the rules you’ve made.',
      learnKicker: 'Munim noticed', learnTitle: 'You marked 3 Swiggy orders as shared', learnSub: 'Treat future Swiggy orders as shared too? You can change this anytime.', yes: 'Yes, make a rule', no: 'No thanks',
      edit: 'Edit', none: 'No rules yet.', foot: 'Rules apply only to your own data and stay on your phone.'
    };
    var base = [
      { id: 'zomato', what: hi ? 'Zomato → काम का खर्च' : 'Zomato → Work expense', scope: hi ? 'सभी ऑर्डर · 19 अक्टूबर से · आपके सुधार से' : 'All orders · since 19 Oct · from your correction' },
      { id: 'swiggy', what: hi ? 'Swiggy → शेयर किया' : 'Swiggy → Shared', scope: hi ? 'आगे के ऑर्डर · आज से' : 'Future orders · from today', needs: true }
    ];
    var list = base.filter(function (r) { return !s.deleted[r.id] && (!r.needs || s.accepted); });
    var rules = list.map(function (r, i) { return { what: r.what, scope: r.scope, rule: i < list.length - 1 ? '1px solid var(--hair)' : '0', delLabel: (hi ? 'हटाएँ: ' : 'Delete: ') + r.what,
      del: function () { var m = Object.assign({}, s.deleted); m[r.id] = true; self.setState({ deleted: m }); } }; });
    return {
      theme: this.props.theme ?? 'light', c: C, rules: rules, noRules: rules.length === 0,
      showSuggest: !s.accepted && !s.dismissed,
      accept: function () { self.setState({ accepted: true }); }, dismiss: function () { self.setState({ dismissed: true }); }
    };
  }
}
</script>
</body>
</html>
